<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="400" rx="14" fill="#0f172a"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="450" y="30" fill="#f1f5f9" font-size="18" font-weight="700" text-anchor="middle">Does QLoRA fine-tuning beat zero-shot at extracting fields from contract clauses?</text>
<text x="450" y="52" fill="#fbbf24" font-size="12.5" font-weight="700" text-anchor="middle">The plan only. Nothing below has been built or run: the repository holds a README and a LICENSE.</text>
<rect x="20" y="72" width="160" height="130" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="30" y="94" fill="#fbbf24" font-size="13" font-weight="700">1. Data</text>
<text x="30" y="114" fill="#cbd5e1" font-size="11.5">CUAD contracts,</text>
<text x="30" y="130" fill="#cbd5e1" font-size="11.5">filtered to the</text>
<text x="30" y="146" fill="#cbd5e1" font-size="11.5">extraction task.</text>
<text x="30" y="162" fill="#cbd5e1" font-size="11.5">Train / validation /</text>
<text x="30" y="178" fill="#cbd5e1" font-size="11.5">test split with</text>
<text x="30" y="194" fill="#cbd5e1" font-size="11.5">leakage checks.</text>
<rect x="200" y="72" width="160" height="130" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="210" y="94" fill="#fbbf24" font-size="13" font-weight="700">2. Target</text>
<text x="210" y="114" fill="#cbd5e1" font-size="11.5">One JSON per clause:</text>
<text x="210" y="130" fill="#cbd5e1" font-size="11.5">party, obligation,</text>
<text x="210" y="146" fill="#cbd5e1" font-size="11.5">deadline,</text>
<text x="210" y="162" fill="#cbd5e1" font-size="11.5">governing law.</text>
<rect x="380" y="72" width="160" height="130" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="390" y="94" fill="#fbbf24" font-size="13" font-weight="700">3. Fine-tune</text>
<text x="390" y="114" fill="#cbd5e1" font-size="11.5">Qwen2.5-7B-Instruct,</text>
<text x="390" y="130" fill="#cbd5e1" font-size="11.5">4-bit (QLoRA).</text>
<text x="390" y="146" fill="#cbd5e1" font-size="11.5">Supervised training</text>
<text x="390" y="162" fill="#cbd5e1" font-size="11.5">with peft,</text>
<text x="390" y="178" fill="#cbd5e1" font-size="11.5">bitsandbytes, trl.</text>
<rect x="560" y="72" width="160" height="130" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="570" y="94" fill="#fbbf24" font-size="13" font-weight="700">4. Evaluate</text>
<text x="570" y="114" fill="#cbd5e1" font-size="11.5">Same held-out clauses</text>
<text x="570" y="130" fill="#cbd5e1" font-size="11.5">for both models.</text>
<text x="570" y="146" fill="#cbd5e1" font-size="11.5">Score: exact match</text>
<text x="570" y="162" fill="#cbd5e1" font-size="11.5">and F1 per field.</text>
<rect x="740" y="72" width="140" height="130" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="750" y="94" fill="#fbbf24" font-size="13" font-weight="700">5. Compare</text>
<text x="750" y="114" fill="#cbd5e1" font-size="11.5">Fine-tuned minus</text>
<text x="750" y="130" fill="#cbd5e1" font-size="11.5">zero-shot, per</text>
<text x="750" y="146" fill="#cbd5e1" font-size="11.5">field, with</text>
<text x="750" y="162" fill="#cbd5e1" font-size="11.5">sample-size</text>
<text x="750" y="178" fill="#cbd5e1" font-size="11.5">caveats.</text>
<g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M182 137 H198"/><path d="M362 137 H378"/><path d="M542 137 H558"/><path d="M722 137 H738"/></g>
<rect x="560" y="226" width="160" height="50" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="570" y="246" fill="#fbbf24" font-size="12" font-weight="700">Baseline model</text>
<text x="570" y="263" fill="#cbd5e1" font-size="11.5">Same model, no tuning</text>
<path d="M640 226 V204" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none"/>
<text x="450" y="312" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Not defined in the plan yet</text>
<text x="450" y="332" fill="#cbd5e1" font-size="12" text-anchor="middle">How CUAD labels map to the four target fields</text>
<text x="450" y="350" fill="#cbd5e1" font-size="12" text-anchor="middle">Whether the split is by clause or by whole contract</text>
<text x="450" y="368" fill="#cbd5e1" font-size="12" text-anchor="middle">Size of the test set, hyperparameters, and what counts as a win</text>
</svg>